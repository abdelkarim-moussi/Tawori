<div class="container mx-auto p-6 bg-gray-50 min-h-screen">
  <!-- Search & Filter Header -->
  <app-search-filters-header
    [isLoading]="isLoading"
    (search)="onSearch($event)"
  >
  </app-search-filters-header>

  <div
    *ngIf="isLoading"
    class="flex flex-col items-center justify-center py-20"
  >
    <div
      class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"
    ></div>
    <p class="mt-4 text-gray-600 font-medium">Loading Favorites...</p>
  </div>

  <div
    *ngIf="errorMessage"
    class="bg-red-50 border-l-4 border-red-500 p-4 mb-6"
  >
    <p class="text-red-700">{{ errorMessage }}</p>
  </div>

  <div *ngIf="!isLoading && favorites.length > 0">
    <div class="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-8">
      <app-favorite-card
        *ngFor="
          let favorite of filtredFavorites
            | paginate: { itemsPerPage: resultsPerPage, currentPage: page }
        "
        [favorite]="favorite"
      >
      </app-favorite-card>
    </div>

    <div class="flex justify-center items-center space-x-4 mt-12 pb-10">
      <button
        (click)="goToPreviousPage()"
        [disabled]="page === 1"
        class="px-6 py-2 bg-white border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 cursor-pointer hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-all"
      >
        previous
      </button>

      <span class="text-gray-600 font-semibold">page {{ page }}</span>

      <button
        (click)="goToNextPage()"
        [disabled]="page >= totalPages"
        class="px-6 py-2 bg-indigo-500 text-white rounded-lg shadow-sm text-sm font-medium hover:bg-indigo-600 cursor-pointer transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        next
      </button>
    </div>
  </div>

  <div
    *ngIf="!isLoading && favorites.length === 0 && !errorMessage"
    class="text-center py-20"
  >
    <div class="text-gray-400 text-6xl mb-4 text-center">📭</div>
    <p class="text-gray-500 text-xl">There Is No Favorites.</p>
  </div>
</div>
