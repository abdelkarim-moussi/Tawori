<div
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-indigo-50/30 to-violet-50/40 px-4">
    <div class="w-full max-w-sm">
        <!-- Card -->
        <div
            class="bg-white/80 backdrop-blur-md rounded-2xl shadow-[0_8px_40px_rgba(0,0,0,0.08)] p-6 border border-white/60">

            <!-- Header -->
            <div class="text-center mb-5">
                <div
                    class="w-11 h-11 mx-auto mb-3 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 flex items-center justify-center shadow-[0_4px_16px_rgba(99,102,241,0.35)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                        <polyline points="10 17 15 12 10 7" />
                        <line x1="15" y1="12" x2="3" y2="12" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-[#1e1b4b]">Welcome Back</h1>
                <p class="text-sm text-slate-500 mt-1">Sign in to your Tawori account</p>
            </div>

            <!-- Error Message -->
            <div *ngIf="errorMessage"
                class="bg-red-50 border border-red-200 rounded-lg px-4 py-2.5 mb-4 text-sm text-red-600 font-medium">
                {{ errorMessage }}
            </div>

            <!-- Form -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                <!-- Email -->
                <div class="mb-4">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
                    <input type="email" id="email" formControlName="email" placeholder="john.doe@example.com"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white"
                        [ngClass]="{'border-red-400 focus:border-red-400 focus:ring-red-100': loginForm.get('email')?.invalid && loginForm.get('email')?.touched}" />
                    <p *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched"
                        class="text-red-500 text-xs mt-1">Email is required</p>
                    <p *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched"
                        class="text-red-500 text-xs mt-1">Please enter a valid email</p>
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                    <input type="password" id="password" formControlName="password" placeholder="Enter your password"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white"
                        [ngClass]="{'border-red-400 focus:border-red-400 focus:ring-red-100': loginForm.get('password')?.invalid && loginForm.get('password')?.touched}" />
                    <p *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched"
                        class="text-red-500 text-xs mt-1">Password is required</p>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="isSubmitting"
                    class="w-full py-3 px-4 rounded-lg text-sm font-bold tracking-wide text-white bg-gradient-to-r from-indigo-500 to-violet-500 shadow-[0_4px_16px_rgba(99,102,241,0.35)] transition-all duration-300 hover:shadow-[0_8px_28px_rgba(99,102,241,0.45)] hover:-translate-y-px active:scale-[0.98] active:translate-y-0 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-[0_4px_16px_rgba(99,102,241,0.35)] cursor-pointer">
                    <span *ngIf="!isSubmitting">Sign In</span>
                    <span *ngIf="isSubmitting" class="flex items-center justify-center gap-2">
                        <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Signing in...
                    </span>
                </button>
            </form>

            <!-- Register Link -->
            <p class="text-center text-sm text-slate-500 mt-6">
                Don't have an account?
                <a routerLink="/register"
                    class="text-indigo-500 font-semibold hover:text-indigo-600 transition-colors no-underline">Create
                    one</a>
            </p>
        </div>
    </div>
</div>
