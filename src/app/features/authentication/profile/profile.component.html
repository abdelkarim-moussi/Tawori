<div
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-indigo-50/30 to-violet-50/40 px-4 py-10">
    <div class="w-full max-w-sm">
        <!-- Loading -->
        <div *ngIf="isLoading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-500"></div>
            <p class="mt-4 text-slate-500 text-sm">Loading profile...</p>
        </div>

        <!-- Card -->
        <div *ngIf="!isLoading"
            class="bg-white/80 backdrop-blur-md rounded-2xl shadow-[0_8px_40px_rgba(0,0,0,0.08)] p-6 border border-white/60">

            <!-- Header -->
            <div class="text-center mb-5">
                <div
                    class="w-11 h-11 mx-auto mb-3 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-500 flex items-center justify-center shadow-[0_4px_16px_rgba(99,102,241,0.35)]">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-[#1e1b4b]">My Profile</h1>
                <p class="text-sm text-slate-500 mt-1">Manage your account details</p>
            </div>

            <!-- Form -->
            <form [formGroup]="profileForm" (ngSubmit)="onSave()">

                <!-- First Name & Last Name -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label for="first-name" class="block text-sm font-semibold text-slate-700 mb-1.5">First
                            Name</label>
                        <input type="text" id="first-name" formControlName="firstName"
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white"
                            [ngClass]="{'border-red-400 focus:border-red-400 focus:ring-red-100': profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched}" />
                        <p *ngIf="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched"
                            class="text-red-500 text-xs mt-1">Required</p>
                    </div>
                    <div>
                        <label for="last-name" class="block text-sm font-semibold text-slate-700 mb-1.5">Last
                            Name</label>
                        <input type="text" id="last-name" formControlName="lastName"
                            class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white"
                            [ngClass]="{'border-red-400 focus:border-red-400 focus:ring-red-100': profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched}" />
                        <p *ngIf="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched"
                            class="text-red-500 text-xs mt-1">Required</p>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-4">
                    <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email</label>
                    <input type="email" id="email" formControlName="email"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white"
                        [ngClass]="{'border-red-400 focus:border-red-400 focus:ring-red-100': profileForm.get('email')?.invalid && profileForm.get('email')?.touched}" />
                    <p *ngIf="profileForm.get('email')?.hasError('required') && profileForm.get('email')?.touched"
                        class="text-red-500 text-xs mt-1">Email is required</p>
                    <p *ngIf="profileForm.get('email')?.hasError('email') && profileForm.get('email')?.touched"
                        class="text-red-500 text-xs mt-1">Invalid email</p>
                </div>

                <!-- New Password -->
                <div class="mb-5">
                    <label for="new-password" class="block text-sm font-semibold text-slate-700 mb-1.5">New Password
                        <span class="text-slate-400 font-normal">(optional)</span></label>
                    <input type="password" id="new-password" formControlName="newPassword"
                        placeholder="Leave blank to keep current"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50/50 text-sm text-slate-800 placeholder-slate-400 outline-none transition-all duration-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:bg-white"
                        [ngClass]="{'border-red-400 focus:border-red-400 focus:ring-red-100': profileForm.get('newPassword')?.invalid && profileForm.get('newPassword')?.touched}" />
                    <p *ngIf="profileForm.get('newPassword')?.hasError('minlength') && profileForm.get('newPassword')?.touched"
                        class="text-red-500 text-xs mt-1">Must be at least 8 characters</p>
                </div>

                <!-- Save Button -->
                <button type="submit" [disabled]="isSaving"
                    class="w-full py-3 px-4 rounded-lg text-sm font-bold tracking-wide text-white bg-gradient-to-r from-indigo-500 to-violet-500 shadow-[0_4px_16px_rgba(99,102,241,0.35)] transition-all duration-300 hover:shadow-[0_8px_28px_rgba(99,102,241,0.45)] hover:-translate-y-px active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
                    <span *ngIf="!isSaving">Save Changes</span>
                    <span *ngIf="isSaving" class="flex items-center justify-center gap-2">
                        <svg class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                        Saving...
                    </span>
                </button>
            </form>

            <!-- Danger Zone -->
            <div class="mt-6 pt-5 border-t border-slate-200">
                <div *ngIf="!showDeleteConfirm">
                    <button (click)="showDeleteConfirm = true"
                        class="w-full py-2.5 px-4 rounded-lg text-sm font-semibold text-red-500 border border-red-200 hover:bg-red-50 transition-all duration-200 cursor-pointer">
                        Delete Account
                    </button>
                </div>

                <div *ngIf="showDeleteConfirm" class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <p class="text-sm text-red-700 font-medium mb-3">Are you sure? This action cannot be undone.</p>
                    <div class="flex gap-3">
                        <button (click)="onDelete()" [disabled]="isDeleting"
                            class="flex-1 py-2 px-3 rounded-lg text-sm font-bold text-white bg-red-500 hover:bg-red-600 transition-all cursor-pointer disabled:opacity-60">
                            <span *ngIf="!isDeleting">Yes, delete</span>
                            <span *ngIf="isDeleting">Deleting...</span>
                        </button>
                        <button (click)="showDeleteConfirm = false"
                            class="flex-1 py-2 px-3 rounded-lg text-sm font-semibold text-slate-600 bg-white border border-slate-200 hover:bg-slate-50 transition-all cursor-pointer">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
