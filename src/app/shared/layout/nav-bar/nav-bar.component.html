<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100 shadow-[0_1px_12px_rgba(0,0,0,0.04)]"
>
  <div class="container mx-auto px-6 h-14 flex items-center justify-between">
    <!-- Logo -->
    <a routerLink="/offers" class="flex items-center gap-2 no-underline">
      <img
        src="assets/Tawori-logo.png"
        alt="Tawori"
        class="h-[100px] w-[120px]"
      />
    </a>

    <!-- Navigation -->
    <nav class="flex items-center gap-1">
      <a
        routerLink="/offers"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:text-indigo-600 hover:bg-indigo-50/50 transition-all duration-200 no-underline"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-[18px] h-[18px]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
        </svg>
        <span class="hidden sm:inline">Offers</span>
      </a>

      <a
        routerLink="/applications"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:text-indigo-600 hover:bg-indigo-50/50 transition-all duration-200 no-underline"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-[18px] h-[18px]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
          />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
        <span class="hidden sm:inline">Applications</span>
      </a>

      <a
        routerLink="/favorites"
        routerLinkActive="text-indigo-600 bg-indigo-50"
        class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold text-slate-500 hover:text-indigo-600 hover:bg-indigo-50/50 transition-all duration-200 no-underline"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-[18px] h-[18px]"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12.01 6.001C6.5 1 1 8 5.782 13.001L12.011 20l6.23-7C23 8 17.5 1 12.01 6.002Z"
          />
        </svg>
        <span class="hidden sm:inline">Favorites</span>
      </a>
    </nav>
  </div>
</header>

<!-- Spacer to offset fixed header -->
<div class="h-14"></div>
