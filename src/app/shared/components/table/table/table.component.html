<table>
  <thead>
    <tr>
      @for (col of columns(); track col) {
        <th>{{ col.headerText }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (data of tableData(); track data) {
      <tr>
        @for (col of columns(); track col) {
          @if (col.field) {
            <td>{{ data[col.field] }}</td>
          }
        }
      </tr>
    }
  </tbody>
</table>
