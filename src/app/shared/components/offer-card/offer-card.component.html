<div
  class="offer-card relative rounded-xl p-[2px] h-full cursor-default transition-transform duration-350 ease-[cubic-bezier(0.22,1,0.36,1)] hover:-translate-y-1.5 group"
>
  <div
    class="absolute inset-0 rounded-xl animate-[glow-shift_6s_ease_infinite] opacity-35 group-hover:opacity-100 transition-opacity duration-400 z-0"
  ></div>

  <div
    class="card-inner relative z-1 flex flex-col h-full p-[18px] rounded-xl bg-white/85 backdrop-blur-md shadow-[0_4px_24px_rgba(0,0,0,0.06),inset_0_1px_0_rgba(255,255,255,0.6)] group-hover:shadow-[0_12px_40px_rgba(99,102,241,0.15),inset_0_1px_0_rgba(255,255,255,0.8)] transition-shadow duration-350"
  >
    <div class="flex justify-between items-start mb-3">
      <div
        class="inline-flex items-center gap-1.5 px-2.5 py-[3px] rounded-full text-[0.65rem] font-semibold tracking-wide uppercase text-indigo-500 bg-gradient-to-br from-indigo-500/10 to-violet-500/10 border border-indigo-500/15"
      >
        <span
          class="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-[pulse-dot_2s_ease_infinite]"
        ></span>
        {{ offer.apiSource }}
      </div>

      <div
        class="w-[34px] h-[34px] rounded-xl flex items-center justify-center bg-gradient-to-br from-indigo-500 to-indigo-300 text-white shadow-[0_4px_12px_rgba(99,102,241,0.3)] transition-all duration-300 group-hover:rotate-[-8deg] group-hover:scale-[1.08] group-hover:shadow-[0_6px_20px_rgba(99,102,241,0.45)]"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h2
      class="text-base font-bold leading-tight text-[#1e1b4b] mb-2.5 line-clamp-2 transition-colors duration-300 group-hover:text-indigo-500"
    >
      {{ offer.title }}
    </h2>

    <!-- Company -->
    <div class="flex items-center gap-1.5 mb-1.5 text-[0.8rem] text-slate-600">
      <div
        class="w-6 h-6 rounded-lg flex items-center justify-center bg-indigo-500/[0.08] text-indigo-500 shrink-0"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 13.255A23.931 23.931 0 0 1 12 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2m4 6h.01M5 20h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"
          />
        </svg>
      </div>
      <span class="font-semibold text-slate-700">{{ offer.company }}</span>
    </div>

    <!-- Location -->
    <div class="flex items-center gap-1.5 mb-1.5 text-[0.8rem] text-slate-600">
      <div
        class="w-6 h-6 rounded-lg flex items-center justify-center bg-red-500/[0.08] text-red-500 shrink-0"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"
          />
          <circle cx="12" cy="11" r="3" />
        </svg>
      </div>
      <span>{{ offer.location }}</span>
    </div>

    <!-- Date -->
    <div
      class="flex items-center gap-1.5 text-[0.7rem] text-slate-400 mt-0.5 mb-3.5 pt-2.5 border-t border-slate-400/15"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-[13px] h-[13px] shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span>{{ offer.createdAt | date: "dd-mm-yyyy" }}</span>
    </div>

    <!-- CTA Buttons -->

    <div class="flex gap-5 mt-auto">
      <a
        [href]="offer.url"
        target="_blank"
        rel="noopener noreferrer"
        class="card-cta flex items-center justify-center gap-2 w-full mt-auto py-2 px-3 rounded-md text-[0.8rem] font-bold tracking-wide text-white bg-indigo-500 hover:bg-indigo-600 shadow-gray-300 no-underline transition-all duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] relative overflow-hidden hover:shadow-[0_8px_28px_rgba(139,92,246,0.45)] hover:-translate-y-px active:scale-[0.97] active:translate-y-0"
      >
        <span class="relative z-1">Track Application</span>
      </a>

      <a
        [href]="offer.url"
        target="_blank"
        rel="noopener noreferrer"
        class="card-cta flex items-center justify-center gap-2 w-full mt-auto py-2.5 px-4 text-[0.8rem] font-bold tracking-wide hover:text-indigo-600 no-underline transition-all duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] relative overflow-hidden hover:-translate-y-px active:scale-[0.97] active:translate-y-0"
      >
        <span class="relative z-1">View Offer</span>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4 relative z-1 transition-transform duration-300"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </a>
    </div>
  </div>
</div>
