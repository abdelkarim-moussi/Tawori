<div
  class="favorite-card relative rounded-xl p-[2px] h-full cursor-default transition-transform duration-350 ease-[cubic-bezier(0.22,1,0.36,1)] hover:-translate-y-1.5 group"
>
  <div
    class="absolute inset-0 rounded-xl animate-[glow-shift_6s_ease_infinite] opacity-35 group-hover:opacity-100 transition-opacity duration-400 z-0"
  ></div>

  <div
    class="card-inner relative z-1 flex flex-col h-full p-[18px] rounded-xl bg-white/85 backdrop-blur-md shadow-[0_4px_24px_rgba(0,0,0,0.06),inset_0_1px_0_rgba(255,255,255,0.6)] group-hover:shadow-[0_12px_40px_rgba(239,68,68,0.12),inset_0_1px_0_rgba(255,255,255,0.8)] transition-shadow duration-350"
  >
    <!-- Header -->
    <div class="flex justify-between items-start mb-3">
      <div
        class="inline-flex items-center gap-1.5 px-2.5 py-[3px] rounded-full text-[0.65rem] font-semibold tracking-wide uppercase text-red-500 bg-gradient-to-br from-red-500/10 to-pink-500/10 border border-red-500/15"
      >
        <span
          class="w-1.5 h-1.5 rounded-full bg-red-500 animate-[pulse-dot_2s_ease_infinite]"
        ></span>
        Favorite
      </div>
    </div>

    <!-- Title -->
    <h2
      class="text-base font-bold leading-tight text-[#1e1b4b] mb-2.5 line-clamp-2 transition-colors duration-300 group-hover:text-red-500"
    >
      {{ favorite.title }}
    </h2>

    <div class="flex gap-x-5 justify-between">
      <!-- Company -->
      <div
        class="flex items-center gap-1.5 mb-1.5 text-[0.8rem] text-slate-600"
      >
        <div
          class="w-6 h-6 rounded-lg flex items-center justify-center bg-indigo-500/[0.08] text-indigo-500 shrink-0"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M21 13.255A23.931 23.931 0 0 1 12 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2m4 6h.01M5 20h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2z"
            />
          </svg>
        </div>
        <span class="font-semibold text-slate-700">{{ favorite.company }}</span>
      </div>

      <!-- Location -->
      <div
        class="flex items-center gap-1.5 mb-1.5 text-[0.8rem] text-slate-600"
      >
        <div
          class="w-6 h-6 rounded-lg flex items-center justify-center bg-red-500/[0.08] text-red-500 shrink-0"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z"
            />
            <circle cx="12" cy="11" r="3" />
          </svg>
        </div>
        <span>{{ favorite.location }}</span>
      </div>
    </div>

    <!-- Remove CTA -->
    <div
      class="flex gap-5 mt-auto justify-end pt-3 border-t border-slate-400/15"
    >
      <button
        (click)="removeFromFavorites()"
        class="flex items-center justify-center cursor-pointer gap-2 mt-auto py-2 px-4 rounded-md text-[0.8rem] font-bold tracking-wide text-white bg-red-500 hover:bg-red-600 shadow-gray-300 no-underline transition-all duration-300 ease-[cubic-bezier(0.22,1,0.36,1)] relative overflow-hidden hover:shadow-[0_8px_28px_rgba(239,68,68,0.45)] hover:-translate-y-px active:scale-[0.97] active:translate-y-0"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6" />
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          />
        </svg>
        <span class="relative z-1">Remove</span>
      </button>
    </div>
  </div>
</div>
